name: CI/CD Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: x86_64
            runner: macos-13
          - os: macos
            arch: arm64
            runner: macos-14
          - os: windows
            arch: x86_64
            runner: windows-latest
          # Windows ARM64 is not natively supported by GitHub-hosted runners yet.
          # To fully support Windows ARM64, cross-compilation or a self-hosted runner would be required.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-14 libllvm14 llvm-14-dev pkg-config

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@14 pkg-config

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.x
          dune-version: 3.10.0

      - name: Install OCaml Dependencies
        run: opam install . --deps-only --with-test

      - name: Build Ardium
        run: opam exec -- dune build --release

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp _build/default/bin/main.exe dist/ardium.exe
          else
            cp _build/default/bin/main.exe dist/ardium
          fi
          # Also package stdlib and runtime if they are needed alongside the binary
          cp -r stdlib dist/ || true
          cp -r lib dist/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ardium-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/*; do
            if [ -d "$dir" ]; then
              base=$(basename "$dir")
              # Archive directories into zip for Windows, tar.gz for others
              if [[ "$base" == *"windows"* ]]; then
                cd "$dir" && zip -r "../../release-assets/${base}.zip" ./* && cd ../..
              else
                cd "$dir" && tar -czvf "../../release-assets/${base}.tar.gz" ./* && cd ../..
              fi
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
